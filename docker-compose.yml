version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dripeon-ecommerce
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=your_gemini_api_key_here
      - JWT_ACCESS_SECRET=your_jwt_access_secret_here
      - REFRESH_SECRET=your_jwt_refresh_secret_here
    restart: always
